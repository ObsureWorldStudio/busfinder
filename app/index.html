<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by --base-href when building, e.g. /bus-finder/app/ -->
  <base href="/busfinder/app/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="See where Tshwane's A Re Yeng and Tshwane Bus Services buses are, shared live by riders.">
  <meta name="theme-color" content="#0B6E4F">

  <!-- iPhone "Add to Home Screen" -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bus Finder">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Bus Finder</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0B6E4F; }
    /* Green loading screen, shown until the app has drawn its first frame */
    #loading {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(135deg, #0E8A63, #08533B);
      color: #fff; font: 600 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.3s;
    }
    #loading img { width: 96px; height: auto; }
    #loading .bar { width: 140px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.25); overflow: hidden; }
    #loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #FFC233; border-radius: 2px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/loading_logo.png" alt="">
    <div>Bus Finder</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
